name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund          # pulls movewire, the only dependency, into node_modules
      - run: npm run check && npm test
      - name: stage the static site
        run: |
          mkdir -p _site/node_modules
          rsync -a --exclude node_modules --exclude _site --exclude .github --exclude .git --exclude tools --exclude test --exclude serve.py ./ _site/
          cp -R node_modules/movewire _site/node_modules/movewire
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
