<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Orbits · Greta · one surface, one row, one sheet (mock)</title>
<!-- Static mock at 1512×860. Open as-is for the main screen; add #sheet for the deep state (the sheet open on "pattern").
     The rings are a real capture of orbit2's canvas (afro groove, playing, lane 4 selected): rings.jpg next to this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0c0919; --fg: #f2f0f8; --fg2: rgba(242, 240, 248, 0.72); --fg3: rgba(242, 240, 248, 0.44); --line: rgba(242, 240, 248, 0.12);
    --rec: #ff5c6c;
    --l1: #f0abfc; --l2: #67e8f9; --l3: #fde047; --l4: #a78bfa;   /* lane colours: the only colour on the screen */
    --sel: var(--l4);
    font-family: 'Space Grotesk', system-ui, sans-serif; font-variant-numeric: tabular-nums;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1512px; height: 860px; overflow: hidden; background: var(--bg); color: var(--fg); }
  body { position: relative; background: radial-gradient(ellipse 900px 620px at 50% 42%, #1b1436 0%, #0c0919 70%); }
  button, select { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- the stage: the rings are the screen ---------- */
  .rings { position: absolute; left: 406px; top: 10px; width: 700px; height: 700px; background: url(rings.jpg) center / cover;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 62%, transparent 71%); mask-image: radial-gradient(circle at 50% 50%, #000 62%, transparent 71%); }
  body.sheet .rings { left: 206px; top: 30px; width: 660px; height: 660px; }

  /* ---------- top left: the lanes (legend = selector = mutes) ---------- */
  .lanes { position: absolute; left: 24px; top: 24px; width: 248px; list-style: none; }
  .lane { display: grid; grid-template-columns: 1fr 40px; align-items: center; height: 44px; border-radius: 10px; }
  .lane .tab { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; height: 44px; padding: 0 10px 0 12px; text-align: left; border-radius: 10px; color: var(--fg2); }
  .lane .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .lane .nm { font-size: 15px; font-weight: 500; }
  .lane .meta { font-size: 13px; color: var(--fg3); }
  .lane .m { width: 36px; height: 36px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--fg3); border: 1px solid var(--line); }
  .lane .m[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .lane.on { background: rgba(242, 240, 248, 0.07); box-shadow: inset 3px 0 0 var(--c); }
  .lane.on .tab { color: var(--fg); }
  .lane.muted .nm, .lane.muted .dot { opacity: 0.35; }

  /* ---------- top right: the Move, help, and the modes that are on ---------- */
  .tr { position: absolute; right: 24px; top: 24px; display: flex; gap: 8px; align-items: center; }
  .pill { height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); font-size: 14px; color: var(--fg2); display: inline-flex; align-items: center; gap: 8px; }
  .pill .led { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 3px rgba(242, 240, 248, 0.15); }
  .help { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); color: var(--fg2); font-size: 16px; }
  .modes { position: absolute; right: 24px; top: 76px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .mode { height: 32px; padding: 0 6px 0 14px; border-radius: 16px; background: rgba(242, 240, 248, 0.08); font-size: 13px; display: inline-flex; align-items: center; gap: 8px; color: var(--fg); }
  .mode .x { width: 24px; height: 24px; border-radius: 50%; color: var(--fg3); font-size: 14px; line-height: 24px; text-align: center; }
  .mode.rec { background: rgba(255, 92, 108, 0.16); }
  .mode.rec::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); }
  body.sheet .modes { right: 480px; }

  /* ---------- the console: one band, three groups, one grid ---------- */
  .console { position: absolute; left: 0; right: 0; bottom: 0; height: 144px; border-top: 1px solid var(--line); background: rgba(12, 9, 25, 0.86); }
  .transport { position: absolute; left: 32px; top: 24px; display: grid; grid-template-columns: 80px 104px; grid-template-rows: 44px 40px; column-gap: 16px; row-gap: 12px; }
  .play { grid-row: 1 / 3; width: 80px; height: 80px; margin-top: 8px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 15px; font-weight: 700; display: grid; place-items: center; }
  .play svg { width: 22px; height: 22px; }
  .tbtn { height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; color: var(--fg2); }
  .tbtn.small { height: 40px; }
  .tbtn em { font-style: normal; color: var(--fg3); font-size: 12px; margin-left: 4px; }

  .lanepanel { position: absolute; left: 288px; top: 6px; width: 912px; }
  .lp-head { height: 28px; display: flex; align-items: center; gap: 14px; font-size: 14px; }
  .lp-head .ttl { font-weight: 700; color: var(--fg); display: inline-flex; gap: 8px; align-items: center; }
  .lp-head .ttl i { width: 10px; height: 10px; border-radius: 50%; background: var(--sel); }
  .voice { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--fg2); font-size: 13px; }
  .seg { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { height: 28px; padding: 0 14px; font-size: 13px; color: var(--fg3); }
  .seg button[aria-pressed=true] { background: rgba(242, 240, 248, 0.14); color: var(--fg); }
  .seg button kbd { font: inherit; font-size: 11px; opacity: 0.7; }
  .knobs { display: grid; grid-template-columns: repeat(8, 114px); height: 58px; margin-top: 4px; }
  .knob { display: grid; grid-template-columns: 40px 1fr; column-gap: 8px; align-items: center; padding-left: 10px; }
  .knob svg { width: 40px; height: 40px; grid-row: 1 / 3; }
  .knob b { font-size: 16px; font-weight: 500; align-self: end; }
  .knob span { font-size: 12px; color: var(--fg3); align-self: start; }
  .knob.global b { color: var(--fg); }
  .knob .a { font-size: 10px; font-weight: 700; color: var(--bg); background: var(--sel); border-radius: 3px; padding: 0 3px; margin-left: 4px; vertical-align: 2px; }
  .steps { display: grid; grid-template-columns: repeat(16, 57px); height: 36px; margin-top: 4px; }
  .st { margin: 0 3px; height: 36px; border-radius: 6px; background: rgba(242, 240, 248, 0.06); position: relative; }
  .st:nth-child(4n+1) { margin-left: 7px; }
  .st.on { background: color-mix(in srgb, var(--sel) 62%, transparent); }
  .st.acc { background: var(--sel); }
  .st.gho { background: color-mix(in srgb, var(--sel) 28%, transparent); }
  .st.ph { box-shadow: 0 0 0 2px var(--fg); }
  .st .lk { position: absolute; right: 5px; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--fg); }
  .st .cd { position: absolute; left: 6px; bottom: 4px; font-size: 10px; font-weight: 700; color: var(--bg); }

  .actions { position: absolute; right: 32px; top: 24px; display: grid; grid-template-columns: 116px 116px; gap: 12px 12px; }
  .act { height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; color: var(--fg2); }
  .act.jam { color: var(--fg); }
  .act.jam::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); margin-right: 8px; }
  .act.all { background: rgba(242, 240, 248, 0.1); color: var(--fg); }
  body.sheet .act.all { background: var(--fg); color: var(--bg); }
  .act kbd { font: inherit; font-size: 12px; color: var(--fg3); margin-left: 6px; }

  /* ---------- the sheet (#sheet): everything else, one place, searchable ---------- */
  aside.sheet { display: none; position: absolute; right: 0; top: 0; width: 456px; height: 716px; border-left: 1px solid var(--line); background: #110d22; padding: 24px 28px; }
  body.sheet aside.sheet { display: block; }
  body.sheet .tr { right: 480px; }
  .find { height: 44px; border-radius: 10px; border: 1px solid rgba(242, 240, 248, 0.3); display: flex; align-items: center; padding: 0 14px; gap: 10px; font-size: 15px; color: var(--fg3); }
  .find kbd { margin-left: auto; font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
  .tabs { display: flex; gap: 4px; margin: 16px 0 6px; border-bottom: 1px solid var(--line); }
  .tabs button { height: 36px; padding: 0 10px; font-size: 14px; color: var(--fg3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected=true] { color: var(--fg); border-color: var(--fg); }
  .sec { margin-top: 14px; }
  aside.sheet .chip { padding: 0 10px; }
  .sec h3 { font-size: 12px; font-weight: 500; color: var(--fg3); letter-spacing: 0.04em; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; color: var(--fg2); }
  .chip[aria-pressed=true] { background: rgba(242, 240, 248, 0.14); color: var(--fg); border-color: transparent; }
  .slots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .slot { height: 40px; border-radius: 8px; border: 1px dashed var(--line); font-size: 13px; color: var(--fg3); position: relative; }
  .slot.full { border-style: solid; color: var(--fg2); }
  .slot.now { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
  .slot.next { box-shadow: inset 0 0 0 2px var(--fg); color: var(--fg); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lbl { font-size: 13px; color: var(--fg3); width: 50px; }
  .note { font-size: 13px; color: var(--fg3); margin-top: 8px; }
</style>
</head>
<body>
  <div class="rings" role="img" aria-label="orbits: four rings, conga selected"></div>

  <!-- lanes: legend, selector and mutes in one list (inner ring first) -->
  <ul class="lanes" aria-label="lanes, inner ring first">
    <li class="lane" style="--c: var(--l1)"><button class="tab" role="tab" aria-selected="false"><i class="dot"></i><span class="nm">soft kick</span><span class="meta">4 · ×1</span></button><button class="m" aria-pressed="false" aria-label="mute soft kick">M</button></li>
    <li class="lane" style="--c: var(--l2)"><button class="tab" role="tab" aria-selected="false"><i class="dot"></i><span class="nm">clave</span><span class="meta">16 · ×2</span></button><button class="m" aria-pressed="false" aria-label="mute clave">M</button></li>
    <li class="lane muted" style="--c: var(--l3)"><button class="tab" role="tab" aria-selected="false"><i class="dot"></i><span class="nm">cowbell</span><span class="meta">12 · ×3</span></button><button class="m" aria-pressed="true" aria-label="mute cowbell">M</button></li>
    <li class="lane on" style="--c: var(--l4)"><button class="tab" role="tab" aria-selected="true"><i class="dot"></i><span class="nm">conga</span><span class="meta">16 · ×4</span></button><button class="m" aria-pressed="false" aria-label="mute conga">M</button></li>
  </ul>

  <div class="tr">
    <button class="pill"><i class="led"></i>Move · live</button>
    <button class="help" aria-label="help">?</button>
  </div>
  <!-- modes: only what is ON shows, each one a button to its settings, × turns it off -->
  <div class="modes" aria-label="modes on">
    <span class="mode">evolve · every 8 bars <button class="x" aria-label="evolve off">×</button></span>
    <span class="mode">chain 1 → 3 · next bar <button class="x" aria-label="stop chain">×</button></span>
  </div>

  <aside class="sheet" aria-label="all controls">
    <div class="find">⌕ find any control: “stems”, “swing”, “seed”…<kbd>⌘K</kbd></div>
    <div class="tabs" role="tablist">
      <button role="tab">lane</button><button role="tab" aria-selected="true">pattern</button><button role="tab">groove</button><button role="tab">perform</button><button role="tab">export</button><button role="tab">setup</button>
    </div>
    <div class="sec"><h3>start from <span>long-press randomize = wild</span></h3>
      <div class="chips"><button class="chip">today’s seed</button><button class="chip">lo-fi boom bap</button><button class="chip">trap</button><button class="chip">house</button><button class="chip">techno</button><button class="chip">DnB</button><button class="chip" aria-pressed="true">afro</button><button class="chip">3 vs 4 vs 5</button><button class="chip">init</button><button class="chip">wild</button></div></div>
    <div class="sec"><h3>slots <span>tap = load · long-press = save, chain, erase</span></h3>
      <div class="slots"><button class="slot full">1</button><button class="slot now">2</button><button class="slot full next">3</button><button class="slot full">4</button><button class="slot">5</button><button class="slot">6</button><button class="slot">7</button><button class="slot">8</button><button class="slot">9</button><button class="slot">10</button><button class="slot">11</button><button class="slot">12</button><button class="slot">13</button><button class="slot">14</button><button class="slot">15</button><button class="slot">16</button></div>
      <div class="row" style="margin-top:10px"><span class="lbl">switch</span><button class="chip">now</button><button class="chip" aria-pressed="true">next bar</button><button class="chip">cycle</button><button class="chip" aria-pressed="true" style="margin-left:auto">restart lanes</button></div>
      <div class="row" style="margin-top:8px"><span class="lbl">chain</span><span style="font-size:14px">1 → 2 → 3 · 4 bars each</span><button class="chip" style="margin-left:auto">stop chain</button></div></div>
    <div class="sec"><h3>shape</h3>
      <div class="row"><span class="lbl">meter</span><button class="chip" aria-pressed="true">4/4</button><button class="chip">3/4</button><button class="chip">5/4</button><button class="chip">6/8</button><button class="chip">7/8</button><button class="chip">12/8</button></div>
      <div class="row" style="margin-top:8px"><span class="lbl">lanes</span><button class="chip" aria-pressed="true">4</button><button class="chip">6</button><button class="chip" style="margin-left:auto">clear lane</button></div></div>
    <div class="sec"><h3>library <span>3 setups</span></h3>
      <div class="row"><button class="chip">save as…</button><button class="chip">night bus</button><button class="chip">clave study</button><button class="chip">…all 3</button></div></div>
  </aside>

  <footer class="console">
    <div class="transport" role="group" aria-label="transport">
      <button class="play" aria-label="stop"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="1.5" fill="currentColor"/></svg></button>
      <button class="tbtn">fill <em>hold</em></button>
      <button class="tbtn small">undo</button>
    </div>

    <section class="lanepanel" aria-label="selected lane: conga">
      <div class="lp-head">
        <span class="ttl"><i></i>4 · conga</span>
        <button class="voice">voice: conga ▾</button>
        <span style="font-size:13px;color:var(--fg3)">steps 1–16 of 16</span>
        <div class="seg" role="group" aria-label="knob page"><button aria-pressed="true">rhythm</button><button aria-pressed="false">sound <kbd>shift</kbd></button></div>
      </div>
      <div class="knobs" id="knobs"></div>
      <div class="steps" id="steps" role="group" aria-label="conga steps"></div>
    </section>

    <div class="actions">
      <button class="act">randomize</button>
      <button class="act jam">jam</button>
      <button class="act">share</button>
      <button class="act all">all <kbd>⌘K</kbd></button>
    </div>
  </footer>

<script>
  if (/sheet/.test(location.hash + location.search)) document.body.classList.add('sheet');
  // knob row = the Move's knob row: 1 length · 2 hits · 3 shift · 4 speed · 5 swing · 6 chance · 7 tune · 8 tempo (all lanes)
  const K = [['16', 'length', 0.5], ['0', 'hits', 0], ['2', 'shift', 0.12], ['×4', 'speed', 0.62], ['12%', 'swing', 0.24], ['85%', 'chance', 0.85, 'A'], ['−2', 'tune', 0.44], ['112', 'tempo', 0.41, '', true]];
  const arc = (f) => { const a0 = Math.PI * 0.75, a = a0 + Math.PI * 1.5 * f, p = (t) => [20 + 15 * Math.cos(t), 20 + 15 * Math.sin(t)], [x0, y0] = p(a0), [x1, y1] = p(a); return { d: `M ${x0} ${y0} A 15 15 0 ${a - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}`, x: x1, y: y1 }; };
  const full = arc(1);
  document.getElementById('knobs').innerHTML = K.map(([v, l, f, A, g]) => { const c = g ? 'var(--fg)' : 'var(--sel)', r = arc(f);
    return `<div class="knob${g ? ' global' : ''}" role="slider" aria-label="${l}" tabindex="0"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="${full.d}" stroke="rgba(242,240,248,.14)" stroke-width="3" fill="none" stroke-linecap="round"/>${f > 0.01 ? `<path d="${r.d}" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/>` : ''}<circle cx="${r.x}" cy="${r.y}" r="3.2" fill="${c}"/></svg><b>${v}${A ? '<span class="a">A</span>' : ''}</b><span>${l}</span></div>`; }).join('');
  // conga: 16 steps; on / accent / ghost, a lock dot, a 1:2 condition, playhead on step 7
  const S = ['acc', '', 'gho', 'on', '', '', 'on ph', 'gho', 'acc', '', 'on', 'gho', '', 'on', 'on', ''];
  document.getElementById('steps').innerHTML = S.map((c, i) => `<button class="st ${c}" aria-label="step ${i + 1}">${i === 3 ? '<i class="lk"></i>' : ''}${i === 13 ? '<span class="cd">1:2</span>' : ''}</button>`).join('');
</script>
</body>
</html>
