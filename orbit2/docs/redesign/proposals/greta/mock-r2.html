<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Orbits · Greta · round 2: the Orbit console in a dark room (mock)</title>
<!-- Round 2 static mock. Hash picks the view:
       (none)   1512×860 main screen at dark-room luminance, rings capped at ~630 px, peek on, three pills
       #sheet   1512×860 the sheet as an overlay in the right column; the rings do not move
       #pages   1512×860 the knob row's pages at full size, one above the other (glance test)
       #small   1280×720, 6 lanes, three pills, sheet open
     Rings are captures of orbit2's real canvas (rings.jpg 4 lanes, rings6.jpg 6 lanes). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* dark-room palette: nothing on the face is brighter than --v (relative luminance 0.46; a planet's core is 1.0) */
    --bg: #0c0919; --v: #b9b5c8; --l: #8d889e; --b: #625d73; --track: #2a2540; --cell: #19152b;
    --rec: #ff6b78;
    --l1: #f0abfc; --l2: #67e8f9; --l3: #fde047; --l4: #a78bfa; --l5: #86efac; --l6: #fdba74;
    font-family: 'Space Grotesk', system-ui, sans-serif; font-variant-numeric: tabular-nums;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow: hidden; background: var(--bg); color: var(--v); }
  body { position: relative; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .abs { position: absolute; }

  .rings { position: absolute; background-position: center; background-size: cover;
    -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 71%); mask-image: radial-gradient(circle, #000 62%, transparent 71%); }
  .cap { position: absolute; font-size: 12px; color: var(--l); }

  /* lanes: legend + selector + mutes */
  .lanes { position: absolute; left: 24px; top: 24px; list-style: none; }
  .lane { display: grid; grid-template-columns: 1fr 40px; align-items: center; height: var(--row, 44px); border-radius: 8px; }
  .lane .tab { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; height: 100%; padding: 0 10px 0 12px; text-align: left; color: var(--l); }
  .lane .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .lane .nm { font-size: 15px; font-weight: 500; }
  .lane .meta { font-size: 13px; color: var(--l); }
  .lane .m { width: 36px; height: 36px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--l); border: 1px solid var(--b); }
  .lane .m[aria-pressed=true] { border: 2px solid var(--v); color: var(--v); }
  .lane.on { box-shadow: inset 3px 0 0 var(--c); background: rgba(185, 181, 200, 0.05); }
  .lane.on .nm { color: var(--v); }
  .lane.muted .nm { text-decoration: line-through; }

  /* peek: the touched knob, big (Nils), in the left column, never on the rings */
  .peek { position: absolute; left: 36px; }
  .peek .k { font-size: 13px; color: var(--l); }
  .peek .k b { color: var(--c); font-weight: 500; }
  .peek .n { font-size: 64px; font-weight: 300; line-height: 1.05; color: var(--v); }
  .peek .s { font-size: 14px; color: var(--l); }

  /* right column: Move, help, pills; the sheet opens under the last pill */
  .tr { position: absolute; top: 24px; display: flex; gap: 8px; }
  .pill { height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--b); font-size: 14px; color: var(--v); display: inline-flex; align-items: center; gap: 8px; }
  .pill .led { width: 8px; height: 8px; border-radius: 50%; background: var(--v); }
  .help { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--b); font-size: 16px; color: var(--v); }
  .modes { position: absolute; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .mode { height: 32px; padding: 0 4px 0 14px; border-radius: 16px; background: rgba(185, 181, 200, 0.08); font-size: 13px; display: inline-flex; align-items: center; gap: 8px; color: var(--v); }
  .mode .x { width: 26px; height: 26px; border-radius: 50%; color: var(--l); font-size: 14px; }
  .mode.rec { color: var(--rec); background: rgba(255, 107, 120, 0.1); }
  .mode.rec::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); }

  .sheet { position: absolute; right: 0; bottom: var(--ch); border-left: 1px solid var(--b); border-top: 1px solid var(--b); border-top-left-radius: 12px; background: #110d22; padding: 18px 22px; overflow: hidden; }
  .sheet::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: linear-gradient(transparent, #110d22); }
  .find { height: 40px; border-radius: 8px; border: 1px solid var(--b); display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: var(--l); }
  .find kbd { margin-left: auto; font: inherit; font-size: 12px; }
  .tabs { display: flex; gap: 2px; margin: 10px 0 4px; border-bottom: 1px solid var(--b); }
  .tabs button { height: 34px; padding: 0 8px; font-size: 13px; color: var(--l); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected=true] { color: var(--v); border-color: var(--v); }
  .sec { margin-top: 12px; }
  .sec h3 { font-size: 12px; font-weight: 500; color: var(--l); margin-bottom: 6px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .chip { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--b); font-size: 13px; color: var(--v); }
  .chip[aria-pressed=true] { border: 2px solid var(--v); }
  .lbl { font-size: 13px; color: var(--l); width: 70px; }
  .gk { display: inline-grid; grid-template-columns: 32px auto; column-gap: 6px; align-items: center; width: 92px; }
  .gk svg { width: 32px; height: 32px; grid-row: 1 / 3; } .gk b { font-size: 14px; font-weight: 500; align-self: end; } .gk span { font-size: 11px; color: var(--l); align-self: start; }

  /* the console */
  .console { position: absolute; left: 0; right: 0; bottom: 0; height: var(--ch); background: var(--bg); }
  .console .rule { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: color-mix(in srgb, var(--sel) 60%, var(--bg)); }
  .grp { position: absolute; }
  .play { position: absolute; border-radius: 50%; border: 2px solid var(--v); color: var(--v); display: grid; place-items: center; }
  .tb { display: block; border-radius: 8px; border: 1px solid var(--b); font-size: 13px; color: var(--v); text-align: left; padding: 0 10px; }
  .tb em { font-style: normal; color: var(--l); font-size: 12px; }
  .lp { position: absolute; }
  .head { height: 28px; display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .head .ttl { font-weight: 700; color: var(--v); display: inline-flex; gap: 8px; align-items: center; }
  .head .ttl i { width: 10px; height: 10px; border-radius: 50%; background: var(--sel); }
  .head .ttl .stp { color: var(--sel); }
  .head .voice { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--b); font-size: 13px; color: var(--v); }
  .head .note { font-size: 13px; color: var(--l); }
  .head .lnk { font-size: 13px; color: var(--v); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--b); }
  .seg { margin-left: auto; display: inline-flex; gap: 0; }
  .seg button { height: 28px; padding: 0 12px; font-size: 13px; color: var(--l); border-bottom: 3px solid var(--track); }
  .seg button[aria-pressed=true] { color: var(--v); border-color: var(--sel); }
  .seg button:disabled { opacity: 1; color: var(--l); cursor: default; }
  .knobs { display: grid; margin-top: 4px; border-radius: 8px; }
  .knobs.shift { background: color-mix(in srgb, var(--sel) 9%, transparent); }
  .knob { display: grid; grid-template-columns: 40px 1fr; column-gap: 8px; align-items: center; padding-left: 10px; position: relative; }
  .knob svg { width: 40px; height: 40px; grid-row: 1 / 3; }
  .knob b { font-size: 16px; font-weight: 500; align-self: end; color: var(--v); }
  .knob b.inh { color: var(--l); font-weight: 400; }
  .knob span { font-size: 12px; color: var(--l); align-self: start; }
  .knob .no { position: absolute; left: 1px; top: 1px; font-size: 10px; color: var(--l); }
  .knob.touched { background: rgba(185, 181, 200, 0.06); border-radius: 8px; }
  .knob .a { font-size: 10px; font-weight: 700; color: var(--sel); border: 1px solid var(--sel); border-radius: 3px; padding: 0 2px; margin-left: 4px; vertical-align: 2px; }
  .sm .knob { grid-template-columns: 34px 1fr; column-gap: 5px; padding-left: 8px; }
  .sm .knob svg { width: 34px; height: 34px; } .sm .knob b { font-size: 15px; }
  .cells { display: grid; margin-top: 4px; }
  .cell { margin: 0 3px; border-radius: 6px; background: var(--cell); position: relative; display: grid; place-items: center; }
  .cell:nth-child(4n+1) { margin-left: 7px; }
  .cell.on { background: color-mix(in srgb, var(--sel) 45%, var(--bg)); }
  .cell.acc { background: color-mix(in srgb, var(--sel) 62%, var(--bg)); }
  .cell.gho { background: color-mix(in srgb, var(--sel) 22%, var(--bg)); }
  .cell.ph { box-shadow: 0 0 0 2px var(--v); }
  .cell .lk { position: absolute; right: 5px; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--v); }
  /* a condition as a pictogram, no text on a lit cell: one dot per loop of b, the loop it plays on filled */
  .cell .cd { position: absolute; left: 6px; bottom: 5px; display: flex; gap: 3px; }
  .cell .cd i { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--v); }
  .cell .cd i.on { background: var(--v); }
  .cells.loops .cell { background: none; }
  .loop { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--b); }
  .loop.plays { background: color-mix(in srgb, var(--sel) 60%, var(--bg)); border-color: transparent; }
  .loop.now { box-shadow: 0 0 0 2px var(--v); }
  .loopno { position: absolute; bottom: -1px; font-size: 9px; color: var(--l); }

  /* the pages view */
  .strip { position: absolute; left: 0; width: 1512px; }
  .strip .console { position: absolute; top: 26px; bottom: auto; }
  .strip .what { position: absolute; left: 28px; top: 4px; font-size: 13px; color: var(--l); }
  .strip .what b { color: var(--v); font-weight: 500; }
  .title { position: absolute; left: 28px; top: 14px; font-size: 15px; color: var(--v); }
  .title span { color: var(--l); }
</style>
</head>
<body>
<script>
const VIEW = (location.hash + location.search).replace(/[#?]/g, '') || 'main';
const W = VIEW === 'small' ? 1280 : 1512, H = VIEW === 'small' ? 720 : 860, CH = VIEW === 'small' ? 128 : 144;
document.documentElement.style.cssText = `width:${W}px;height:${H}px`; document.body.style.cssText = `width:${W}px;height:${H}px;--ch:${CH}px`;
const LANES4 = [['soft kick', '4 · ×1', 'l1'], ['clave', '16 · ×2', 'l2'], ['cowbell', '12 · ×3', 'l3'], ['conga', '16 · ×4', 'l4']];
const LANES6 = [...LANES4, ['open hat', '8 · ×2', 'l5'], ['crash', '8 · ×1', 'l6']];

// ---- knob drawings: the shape says the page (arc = rhythm, pie = sound, ring = step locks) ----
const P = (cx, cy, r, t) => [cx + r * Math.cos(t), cy + r * Math.sin(t)];
const A0 = Math.PI * 0.75, SW = Math.PI * 1.5;
function arcPath(f, r = 15) { const a = A0 + SW * f, [x0, y0] = P(20, 20, r, A0), [x1, y1] = P(20, 20, r, a); return { d: `M ${x0} ${y0} A ${r} ${r} 0 ${a - A0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}`, x: x1, y: y1 }; }
function knobSvg(kind, f, col, locked = true) {
  if (kind === 'pie') { const a = A0 + SW * f, [x0, y0] = P(20, 20, 15, A0), [x1, y1] = P(20, 20, 15, a);
    return `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="var(--track)"/>${f > 0.01 ? `<path d="M 20 20 L ${x0} ${y0} A 15 15 0 ${a - A0 > Math.PI ? 1 : 0} 1 ${x1} ${y1} Z" fill="color-mix(in srgb, ${col} 70%, var(--bg))"/>` : ''}</svg>`; }
  if (kind === 'ring') { const r = arcPath(f, 13);
    return `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="${locked ? col : 'var(--b)'}" stroke-width="2" ${locked ? '' : 'stroke-dasharray="3 3"'}/>${locked ? `<path d="${r.d}" stroke="${col}" stroke-width="4" fill="none" stroke-linecap="round"/>` : ''}<circle cx="20" cy="20" r="3" fill="${locked ? col : 'var(--b)'}"/></svg>`; }
  const full = arcPath(1), r = arcPath(f);
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="${full.d}" stroke="var(--track)" stroke-width="3" fill="none" stroke-linecap="round"/>${f > 0.01 ? `<path d="${r.d}" stroke="${col}" stroke-width="3" fill="none" stroke-linecap="round"/>` : ''}<circle cx="${r.x}" cy="${r.y}" r="3.2" fill="${col}"/></svg>`;
}
const PAGES = {
  rhythm: [['16', 'length', 0.5], ['0', 'hits', 0], ['2', 'shift', 0.12], ['×4', 'speed', 0.62], ['12%', 'swing', 0.24], ['85%', 'chance', 0.85, 'A'], ['−2', 'tune', 0.44], ['112', 'tempo', 0.41, '', 'g']],
  sound: [['0.42', 'decay', 0.42], ['0.75', 'tone', 0.75], ['0.10', 'drive', 0.1], ['0.55', 'snap', 0.55], ['0.30', 'color', 0.3], ['0.20', 'send', 0.2, 'A'], ['L 12', 'pan', 0.38], ['0.80', 'level', 0.8]],
  step: [['+3', 'tune', 0.56], ['lane', 'chance', 0.85, '', 'inh'], ['0.62', 'velocity', 0.62], ['lane', 'decay', 0.42, '', 'inh'], ['lane', 'tone', 0.75, '', 'inh'], ['lane', 'snap', 0.55, '', 'inh'], ['lane', 'color', 0.3, '', 'inh'], ['1:2', 'condition', 0.2]],
};
const STEPS = ['acc', '', 'gho', 'on', '', '', 'on ph', 'gho', 'acc', '', 'on', 'gho', '', 'on', 'on', ''];

function consoleHtml({ lane = 'l4', name = '4 · conga', page = 'rhythm', touched = -1, w = W, ch = CH }) {
  const small = w < 1400, sel = `var(--${lane})`;
  const cell = small ? 44 : 52, kw = cell * 2, lpW = cell * 16, lpX = small ? 262 : 316;
  const rowH = small ? 32 : 36, knobH = small ? 50 : 56, top = small ? 6 : 8;
  const kind = page === 'sound' ? 'pie' : page === 'step' ? 'ring' : 'arc';
  const knobs = PAGES[page].map(([v, l, f, A, g], i) => {
    const col = g === 'g' ? 'var(--v)' : sel, inh = g === 'inh';
    return `<div class="knob${i === touched ? ' touched' : ''}" role="slider" aria-label="${l}" tabindex="0" style="height:${knobH}px"><i class="no">${i + 1}</i>${knobSvg(kind, f, col, !inh)}<b class="${inh ? 'inh' : ''}">${v}${A ? '<span class="a">A</span>' : ''}</b><span>${l}</span></div>`; }).join('');
  const cells = page === 'step'
    ? Array.from({ length: 16 }, (_, i) => `<div class="cell" style="height:${rowH}px"><i class="loop${i % 2 === 0 ? ' plays' : ''}${i === 5 ? ' now' : ''}"></i></div>`).join('')
    : STEPS.map((c, i) => `<button class="cell ${c}" style="height:${rowH}px" aria-label="step ${i + 1}">${i === 3 ? '<i class="lk"></i>' : ''}${i === 13 ? '<i class="cd" title="plays 1 loop in 2"><i class="on"></i><i></i></i>' : ''}</button>`).join('');
  const head = page === 'step'
    ? `<span class="ttl"><i></i>${name} <span class="stp">› step 7</span></span><span class="note">cells = its 16 loops</span><button class="lnk">clear</button><button class="lnk">more…</button><button class="lnk">done</button>`
    : `<span class="ttl"><i></i>${name}</span><button class="voice">voice: ${name.split('· ')[1]} ▾</button><span class="note">steps 1–16 of 16</span>`;
  const seg = `<div class="seg" role="group" aria-label="knob page"><button aria-pressed="${page === 'rhythm'}">rhythm</button><button aria-pressed="${page === 'sound'}">sound ⇧</button><button aria-pressed="${page === 'step'}" ${page === 'step' ? '' : 'disabled'}>step</button></div>`;
  const pl = small ? 52 : 64, py = (ch - pl) / 2, ax = small ? 82 : 108, aw = small ? 92 : 100, bh = small ? 34 : 36;
  const rx = w - (small ? 20 : 28) - (small ? 208 : 300), rw = small ? 100 : 146;
  return `<footer class="console${small ? ' sm' : ''}" style="--sel:${sel};height:${ch}px">
    <i class="rule"></i>
    <div class="grp" style="left:${small ? 24 : 28}px;top:0;height:${ch}px">
      <button class="play" aria-label="play" style="left:0;top:${py}px;width:${pl}px;height:${pl}px"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M6 4 L16 10 L6 16 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
      <div class="abs" style="left:${ax - (small ? 24 : 28) + (small ? 0 : 0)}px;top:${top + 6}px;width:${aw}px;display:grid;gap:6px">
        <button class="tb" style="height:${bh}px">fill <em>hold</em></button><button class="tb" style="height:${bh}px">fill next</button><button class="tb" style="height:${bh}px">throw <em>hold</em></button></div>
      <div class="abs knob" style="left:${ax + aw + 4 - (small ? 24 : 28)}px;top:${ch / 2 - 28}px;height:56px;width:${small ? 78 : 100}px;padding-left:4px" role="slider" aria-label="filter">${knobSvg('arc', 0.5, 'var(--v)')}<b>off</b><span>filter</span></div>
    </div>
    <section class="lp" style="left:${lpX}px;top:${top}px;width:${lpW}px">
      <div class="head">${head}${seg}</div>
      <div class="knobs${page === 'sound' ? ' shift' : ''}" style="grid-template-columns:repeat(8,${kw}px)">${knobs}</div>
      <div class="cells${page === 'step' ? ' loops' : ''}" style="grid-template-columns:repeat(16,${cell}px)">${cells}</div>
    </section>
    <div class="grp" style="left:${rx}px;top:${top + 6}px;display:grid;grid-template-columns:${rw}px ${rw}px;gap:6px 8px">
      <button class="tb" style="height:${bh}px">undo</button><button class="tb" style="height:${bh}px">randomize</button>
      <button class="tb" style="height:${bh}px"><span style="color:var(--rec)">●</span> jam</button><button class="tb" style="height:${bh}px">share</button>
      <button class="tb" style="height:${bh}px;grid-column:span 2">all <em>⌘K</em></button>
    </div>
  </footer>`;
}

function lanesHtml(list, selIdx, mutedIdx, rowH) {
  return `<ul class="lanes" style="--row:${rowH}px;width:${W < 1400 ? 232 : 248}px" aria-label="lanes, inner ring first">${list.map(([n, m, c], i) =>
    `<li class="lane${i === selIdx ? ' on' : ''}${i === mutedIdx ? ' muted' : ''}" style="--c:var(--${c})"><button class="tab"><i class="dot"></i><span class="nm">${n}</span><span class="meta">${m}</span></button><button class="m" aria-pressed="${i === mutedIdx}" aria-label="mute ${n}">M</button></li>`).join('')}</ul>`;
}
const PILLS = `<span class="mode rec">rec armed · knobs latch <button class="x" aria-label="disarm">×</button></span>
  <span class="mode">evolve · next in 3 bars <button class="x" aria-label="evolve off">×</button></span>
  <span class="mode">chain 1 → 3 · next bar <button class="x" aria-label="stop chain">×</button></span>`;
const SHEET = `<div class="find">⌕ find any control <kbd>⌘K</kbd></div>
  <div class="tabs" role="tablist"><button>lane</button><button>pattern</button><button aria-selected="true">groove</button><button>perform</button><button>export</button><button>setup</button></div>
  <div class="sec"><h3>evolve</h3><div class="row"><button class="chip" aria-pressed="true">on</button><button class="chip">home = now</button><span class="lbl" style="width:auto;margin-left:6px">touches</span><button class="chip" aria-pressed="true">all</button></div>
    <div class="row">${[['8', 'every', 0.4], ['35%', 'amount', 0.35], ['40', 'gravity', 0.4], ['16', 'home after', 0.5]].map(([v, l, f]) => `<div class="gk">${knobSvg('arc', f, 'var(--v)').replace('viewBox', 'width="32" height="32" viewBox')}<b>${v}</b><span>${l}</span></div>`).join('')}</div></div>
  <div class="sec"><h3>coupling</h3><div class="row"><button class="chip">off</button><button class="chip" aria-pressed="true">next lane</button><button class="chip">matrix</button></div></div>
  <div class="sec"><h3>dice</h3><div class="row"><button class="chip">free</button><button class="chip">locked · 4127</button><button class="chip">re-roll</button><button class="chip">pattern from seed</button></div></div>
  <div class="sec"><h3>this lane: conga</h3><div class="row"><span class="lbl">swing</span><button class="chip">straight</button><button class="chip" aria-pressed="true">MPC 16th</button><button class="chip">triplet</button><button class="chip">3-3-2</button></div></div>`;

let html = '';
if (VIEW === 'pages') {
  html += `<p class="title">The knob row's three pages at full size, as seen at 70 cm. <span>Shape says the page (arc · pie · ring), cells say steps or loops, colour says the lane. The labels are for this sheet only.</span></p>`;
  const S = [['rhythm', 'l4', '4 · conga', 'arcs, step cells'], ['sound', 'l4', '4 · conga', 'pies on a lit band, the same cells (Shift held)'], ['step', 'l4', '4 · conga', 'rings, cells turn into loops (a step held)'], ['rhythm', 'l2', '2 · clave', 'another lane: every coloured mark changes hue']];
  S.forEach(([pg, ln, nm, what], i) => { html += `<div class="strip" style="top:${52 + i * 200}px;height:174px"><p class="what"><b>${pg}${pg === 'step' ? ' 7' : ''} · ${nm}</b> · ${what}</p>${consoleHtml({ page: pg, lane: ln, name: nm, w: 1512, ch: 144 })}</div>`; });
} else {
  const small = VIEW === 'small', sheet = VIEW === 'sheet' || small;
  const stageH = H - CH;
  const leftW = small ? 256 : 300, rightX = small ? 900 : 1084;
  // rings: capped, centred in the space between the two columns, never moved by the sheet
  const ringD = small ? Math.min(stageH - 24, rightX - leftW - 24) : 630, img = Math.round(ringD * 700 / 650);
  const cx = small ? (leftW + rightX) / 2 : 756, cy = small ? stageH / 2 : 358;
  html += `<div class="rings" style="background-image:url(${small ? 'rings6.jpg' : 'rings.jpg'});left:${cx - img / 2}px;top:${cy - img / 2}px;width:${img}px;height:${img}px" role="img" aria-label="orbits"></div>`;
  html += lanesHtml(small ? LANES6 : LANES4, 3, 2, small ? 40 : 44);
  const peekTop = small ? 24 + 6 * 40 + 24 : 24 + 4 * 44 + 40;
  html += `<div class="peek" style="top:${peekTop}px;--c:var(--l4)"><p class="k"><b>knob 6</b> · chance · conga</p><p class="n">85%</p><p class="s">plays 85 of 100 loops</p></div>`;
  const R = small ? 24 : 24;
  html += `<div class="tr" style="right:${R}px"><button class="pill"><i class="led"></i>Move · live</button><button class="help" aria-label="help">?</button></div>`;
  html += `<div class="modes" style="right:${R}px;top:76px" role="status" aria-label="modes on">${PILLS}</div>`;
  const sheetTop = 76 + 3 * 40 + 8;
  if (sheet) html += `<aside class="sheet" style="left:${rightX}px;top:${sheetTop}px" aria-label="all controls">${SHEET}</aside>`;
  html += consoleHtml({ touched: 5 });
  html += `<p class="cap" style="left:${cx - 170}px;top:${stageH - 22}px;width:340px;text-align:center">mock note · rings ${Math.round(ringD)} px across · centre fixed</p>`;
}
document.body.insertAdjacentHTML('beforeend', html);
</script>
