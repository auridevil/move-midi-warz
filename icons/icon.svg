    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75"><stop offset="0" stop-color="#2a1c54"/><stop offset="0.6" stop-color="#140d2c"/><stop offset="1" stop-color="#07040f"/></radialGradient>
